[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhsim"
version = "0.1.0"
description = "Core shared primitives for MHSim discrete-event material-handling simulations"
requires-python = ">=3.13"
dependencies = [
    "simpy>=4.1.1",
]

[project.optional-dependencies]
# Downstream animation/plot scripts; the mhsim library itself does not import these.
anim = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["mhsim"]

[tool.setuptools.package-dir]
mhsim = "."
